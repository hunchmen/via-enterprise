spring.application.name=auth-api
server.servlet.context-path=/auth/api

server.port=8082

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/

# Shared JDBC Session Configuration
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION

# Optional initial user. Remove these environment variables after first use.
auth.bootstrap.email=${AUTH_BOOTSTRAP_EMAIL:}
auth.bootstrap.password=${AUTH_BOOTSTRAP_PASSWORD:}

# Logging Configuration
debug=${DEBUG:false}
logging.level.org.springframework=${SPRING_LOG_LEVEL:info}
logging.level.com.via.auth=${AUTH_LOG_LEVEL:info}
logging.file.path=logs
logging.file.name=logs/auth-api.log

### DATABASE CREDENTIALS ###
spring.datasource.url=jdbc:mysql://localhost:3306/ems_db
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### Spring JPA Configuration ###
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

### Flyway Configuration ###
spring.flyway.table=auth_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

#### Swagger Configuration ###
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN
